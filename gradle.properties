# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure configuration
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# -----------------------------------------------------------------------------
# Gradle 9.x Compatibility & Telemetry Fixes
# -----------------------------------------------------------------------------
# Disable Kotlin build reporting without setting unsupported output enum values
kotlin.build.report.enable=false
kotlin.single.build.metrics.enabled=false
